<section class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
  <fieldset>
    <legend class="text-lg font-semibold">2. Columns to keep</legend>
    {% if columns_error %}
    <p class="mt-3 rounded-md bg-red-50 p-3 text-sm text-red-800" role="alert">{{ columns_error }}</p>
    {% endif %}
    {% if all_columns %}
    <input type="hidden" name="columns_for" value="{{ columns_signature }}">
    <div class="mt-3 flex flex-wrap gap-x-5 gap-y-2">
      {% for name in all_columns %}
      <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" name="keep_columns" value="{{ loop.index0 }}"
               {% if loop.index0 in kept_columns %}checked{% endif %}
               class="h-4 w-4 rounded border-slate-300">
        <span>{{ name | show_spaces }}</span>
      </label>
      {% endfor %}
    </div>
    {% else %}
    <p class="mt-1 text-sm text-slate-500">
      Your file's columns will appear here, so you can choose which to keep.
    </p>
    {% endif %}
  </fieldset>
</section>
