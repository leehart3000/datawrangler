stages:
  - check

default:
  image: python:3.14-slim
  before_script:
    - pip install --quiet uv==0.12.23
    - uv sync --locked

lint:
  stage: check
  script:
    - uv run ruff check
    - uv run ruff format --check

typecheck:
  stage: check
  script:
    - uv run mypy src tests

test:
  stage: check
  script:
    - uv run pytest